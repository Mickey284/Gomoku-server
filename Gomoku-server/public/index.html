<div class="panel">
    <div class="panel-title-container">
        <h3 class="panel-title">快速开始</h3>
    </div>
    <div class="lobby-controls">
        <!-- 添加点击事件 -->
        <button class="btn btn-primary" onclick="quickStart()">立即开始</button>
    </div>
</div>

<div class="panel create-room-panel">
    <h3 class="panel-title">创建房间</h3>
    <div class="lobby-controls">
        <div class="room-input">
            <input type="text" id="room-name-input" placeholder="输入房间名称...">
            <button class="btn btn-success" onclick="createRoom()">创建房间</button>
        </div>
    </div>
</div>

<div class="status-bar">
    <div>
        <span class="status-indicator"></span>
        <span id="server-status">正在连接服务器...</span>
    </div>
</div>
